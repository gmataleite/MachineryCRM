# version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    
    container_name: machinerycrm_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - machinerycrm_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  machinerycrm_data: